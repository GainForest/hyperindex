kind: added
body: 'Add a valid-only partial index on records by collection and creation time (`idx_record_timeline_valid`), so collection-wide timeline reads that select only valid records, such as the GainForest feed service, no longer fetch and discard every invalid row. On PostgreSQL, a collection with many invalid records previously cost one random read per skipped row on a cold cache, enough to hit statement timeouts. Per-account reads (filtered by `did`) are not covered. PostgreSQL operators with large record tables should build the index out of band before deploying: run `CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_record_timeline_valid ON record (collection, record_created_at DESC, uri DESC) WHERE record_created_at IS NOT NULL AND validation_status = ''valid'';`, wait for it to finish, and check that `SELECT indisvalid FROM pg_index WHERE indexrelid = to_regclass(''idx_record_timeline_valid'')` returns true. Deploying while that build is still running makes the migration time out after 5 seconds rather than block writes. If the build failed or was cancelled, the migration refuses to start: run `DROP INDEX CONCURRENTLY idx_record_timeline_valid;`, rebuild it, then restart. Without an out-of-band build, the migration builds the index itself and blocks writes to `record` while it does.'
custom:
  Affects: operator
