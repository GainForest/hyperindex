kind: added
body: Add opt-in record version history. Collections listed in RECORD_HISTORY_COLLECTIONS (exact NSIDs or prefix.* patterns, Tap mode) keep every observed version in a new record_version table (removed again when the record or its account is deleted), seeded on startup with a baseline row per existing record, and the new root recordHistory(uri, first, after) GraphQL query pages through them oldest first. History is off by default; migrations 015 and 016 add the table and its indexes.
custom:
  Affects: operator
